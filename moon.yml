# yaml-language-server: $schema=.moon/cache/schemas/tasks.json
# https://moonrepo.dev/docs/config/tasks
$schema: .moon/cache/schemas/tasks.json

fileGroups:
  sources:
    - src/**/*
    - scripts/**/*
    - '*.ts'
    - '*.tsx'
    - '*.json'

tasks:
  # ── QOL ────────────────────────────────────────────────────

  lint:
    command: oxlint
    args:
      - --type-aware
      - --no-error-on-unmatched-pattern
      - --config
      - oxlint.config.ts
    inputs:
      - group: sources
      - /.gitignore
      - /oxlint.config.ts
      - /lint/**/*
    options:
      affectedFiles: args
      shell: false

  format:
    extends: _format
    args:
      - --write
    options:
      cache: false
      internal: false

  format-check:
    extends: _format
    args:
      - --check
    options:
      internal: false

  typecheck:
    command: tsc
    args:
      - --noEmit
    inputs:
      - group: sources
      - /tsconfig.json

  fix:
    command: noop
    deps:
      - lint-fix
      - format
    inputs: []
    options:
      cache: false
      runDepsInParallel: false

  # ── QOL (internal) ─────────────────────────────────────────

  _format:
    command: oxfmt
    args:
      - --no-error-on-unmatched-pattern
      - --config
      - oxfmt.config.ts
    inputs:
      - group: sources
      - /.gitignore
      - /oxfmt.config.ts
    options:
      affectedFiles: args
      shell: false
      internal: true

  lint-fix:
    extends: lint
    args:
      - --fix
    options:
      cache: false

  # ── Test ───────────────────────────────────────────────────

  test:
    command: vitest
    args:
      - --run
    inputs:
      - group: sources
      - /vite.config.ts
      - /tsconfig.json

  # ── Verify ─────────────────────────────────────────────────

  knip:
    command: knip
    inputs:
      - group: sources
      - /knip.config.ts
      - /package.json
      - /moon.yml
      - /.moon/**/*

  # Fails when drizzle/ is out of step with the schema: a migration is missing, uncommitted, or
  # listed in the journal without its SQL file. It also loads scripts/migrate.ts, which every
  # build runs, so a broken import fails here instead of in a deploy.
  migrations-check:
    script: >-
      node_modules/.bin/drizzle-kit generate &&
      git diff --quiet -- drizzle &&
      test -z "$(git ls-files --others --exclude-standard -- drizzle)" &&
      node -e "require('drizzle-orm/migrator').readMigrationFiles({ migrationsFolder: 'drizzle' })" &&
      env -u MIGRATE_ON_BUILD node scripts/migrate.ts --build ||
      { echo 'migrations-check failed: drizzle/ is out of step with the schema (run pnpm db:generate and commit drizzle/), or scripts/migrate.ts failed to load.'; exit 1; }
    inputs:
      - group: sources
      - /pnpm-lock.yaml
      - /drizzle/**/*
