name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: 26

jobs:
  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-repo
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run moon tasks
        env:
          MOON_TOOLCHAIN_FORCE_GLOBALS: true
        run: pnpm exec moon ci :lint :format-check :typecheck :test :bundle :knip

  deploy:
    name: Deploy to Vercel
    needs: static-analysis
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      url: ${{ steps.vercel-deploy.outputs.url }}

    env:
      DEPLOY_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-repo
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Pull Vercel Environment Information
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: pnpm exec vercel pull --yes --environment="$DEPLOY_ENV"

      - name: Build Project Artifacts
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          prod=()
          if [ "$DEPLOY_ENV" = production ]; then prod=(--prod); fi
          pnpm exec moon run app:build -- "${prod[@]}"

      - name: Deploy Project Artifacts
        id: vercel-deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          prod=()
          if [ "$DEPLOY_ENV" = production ]; then prod=(--prod); fi
          url=$(pnpm exec vercel deploy --prebuilt "${prod[@]}")
          echo "Deployed to: $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
