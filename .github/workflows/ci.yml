name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6

      - name: Locate the pnpm store
        id: pnpm-store
        run: |
          dir=$(pnpm store path --silent)
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .moon/cache/hashes
            .moon/cache/outputs
            .moon/cache/states
          key: ${{ runner.os }}-moon-${{ hashFiles('moon.yml', '.moon/**/*.yml', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-moon-${{ hashFiles('moon.yml', '.moon/**/*.yml', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml') }}-

      - name: Run moon tasks
        run: pnpm exec moon ci :lint :format-check :typecheck :test :knip :migrations-check
